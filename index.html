<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Parcel App</title>
  <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="/favicon (1).ico" type="image/x-icon">
  <link rel="shortcut icon" href="/favicon (1).ico" type="image/x-icon">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">

  <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-8 sm:p-10">
    <h6 class="text-2xl font-bold text-gray-800 text-center mb-6">Bbeko Parcel App - Login</h6>

    <form id="loginForm" class="space-y-4">
      <!-- User ID -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">User ID</label>
        <input id="loginId" type="text" placeholder="Enter your ID" required
               class="w-full rounded-lg border px-3 py-2" />
      </div>

      
      <!-- Password -->
<div>
  <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
  <div class="relative">
    <input id="loginPassword" type="password" placeholder="Enter password" required
           class="w-full rounded-lg border px-3 py-2 pr-10" />
    <button type="button" id="togglePassword"
            class="absolute inset-y-0 right-0 px-3 text-gray-500">
      👁
    </button>
  </div>
</div>


      <!-- Role -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Role</label>
        <select id="loginRole" class="w-full rounded-lg border px-3 py-2" required>
          <option value="">Select your role</option>
          <option value="Marketer">Marketer</option>
          <option value="Management">Management</option>
          <option value="Office Assistant">Office Assistant</option>
        </select>
      </div>

      <!-- Submit -->
      <button type="submit" id="loginBtn"
              class="w-full bg-blue-600 text-white rounded-lg py-2 font-semibold hover:bg-blue-700">
        Login
      </button>
    </form>

    <p class="text-xs text-gray-400 mt-6 text-center">
      Please use the User ID, Password, and Role assigned to you by Admin.
    </p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ==== Your Firebase config ====
    const firebaseConfig = {
      apiKey: "AIzaSyB_gTuAS9i-jywpFYLmMEunh2KJmsCW1_o",
      authDomain: "employee-app-c781d.firebaseapp.com",
      projectId: "employee-app-c781d",
      storageBucket: "employee-app-c781d.appspot.com",
      messagingSenderId: "232631444018",
      appId: "1:232631444018:web:37b70fe37975abcc1b922b"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Hash function
    async function sha256hex(message) {
      const msgUint8 = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
      return Array.from(new Uint8Array(hashBuffer))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    }

    // Login submit
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("loginId").value.trim();
      const password = document.getElementById("loginPassword").value.trim();
      const role = document.getElementById("loginRole").value;

      if (!id || !password || !role) {
        alert("Please enter ID, password, and role.");
        return;
      }

      const loginBtn = document.getElementById("loginBtn");
      loginBtn.disabled = true;
      loginBtn.textContent = "Checking...";

      try {
        const hash = await sha256hex(password);

        // Check Firestore for matching userId + passwordHash + role
        const q = query(
          collection(db, "users"),
          where("userId", "==", id),
          where("passwordHash", "==", hash),
          where("role", "==", role)
        );
        const snap = await getDocs(q);

        if (!snap.empty) {
          const doc = snap.docs[0];
          const user = doc.data();

          // Save session
          sessionStorage.setItem("user", JSON.stringify({
            userId: user.userId,
            name: user.name,
            role: user.role
          }));

          window.location.href = "parcelcapture.html";
        } else {
          alert("Invalid ID, password, or role.");
          loginBtn.disabled = false;
          loginBtn.textContent = "Login";
        }
      } catch (err) {
        console.error(err);
        alert("Login error: " + (err.message || err));
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
      }
    });


    // Toggle password visibility
document.getElementById("togglePassword").addEventListener("click", () => {
  const pwd = document.getElementById("loginPassword");
  const btn = document.getElementById("togglePassword");
  if (pwd.type === "password") {
    pwd.type = "text";
    btn.textContent = "🙈"; // eye closed
  } else {
    pwd.type = "password";
    btn.textContent = "👁"; // eye open
  }
});

  </script>
</body>
</html>
