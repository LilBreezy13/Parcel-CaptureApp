  <!-- Scripts --><script type="module">

  getFirestore, collection, addDoc, serverTimestamp,
  query, where, getDocs, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getStorage, ref as storageRef, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

// ===== Firebase config =====
const firebaseConfig = {
  apiKey: "AIzaSyB_gTuAS9i-jywpFYLmMEunh2KJmsCW1_o",
  authDomain: "employee-app-c781d.firebaseapp.com",
  projectId: "employee-app-c781d",
  storageBucket: "employee-app-c781d.firebasestorage.app",
  messagingSenderId: "232631444018",
  appId: "1:232631444018:web:37b70fe37975abcc1b922b"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

// ===== Load logged-in user =====
const user = (() => {
  try { return JSON.parse(sessionStorage.getItem("user")); } catch { return null; }
})();
if (!user || !user.userId) {
  window.location.href = "index.html";
} else {
  document.getElementById("userInfo").textContent = `${user.name} (${user.userId}) - ${user.role}`;
  document.getElementById("capturerName").value = `${user.name} (${user.userId})`;
  document.getElementById("mobileUserInfo").textContent =
    `Parcel Capture ${user.name} (${user.userId}) - ${user.role}`;
}

// prevent form default submits
document.querySelectorAll("form").forEach(f => {
  f.addEventListener("submit", e => e.preventDefault());
});

// ===== Sign out =====
document.getElementById("signOutBtn").addEventListener("click", () => {
  sessionStorage.removeItem("user");
  window.location.href = "index.html";
});

// ===== Camera setup =====
const videoEl = document.getElementById('camera');
const thumbs = document.getElementById('thumbs');
const captureBtn = document.getElementById('captureBtn');
const filePicker = document.getElementById('filePicker');
const switchCamBtn = document.getElementById('switchCam');

let currentStream = null;
let useBackCamera = true;
let capturedBlobs = [];

async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    document.getElementById('cameraHint').textContent = 'Camera not available. Use 📁 to select a photo.';
    return;
  }
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  try {
    currentStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: useBackCamera ? { exact: 'environment' } : 'user' },
      audio: false
    });
  } catch {
    try {
      currentStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: useBackCamera ? 'environment' : 'user' },
        audio: false
      });
    } catch (err) {
      console.warn('Camera failed, use file picker instead', err);
      document.getElementById('cameraHint').textContent = 'Could not access camera. Use 📁 instead.';
      return;
    }
  }
  videoEl.srcObject = currentStream;
}

// ===== Capture frame =====
async function captureFrame(videoEl, maxW = 800, maxH = 600, quality = 0.7) {
  const canvas = document.createElement('canvas');
  canvas.width = videoEl.videoWidth;
  canvas.height = videoEl.videoHeight;
  canvas.getContext('2d').drawImage(videoEl, 0, 0);

  const ratio = Math.min(1, maxW / canvas.width, maxH / canvas.height);
  const outW = Math.round(canvas.width * ratio);
  const outH = Math.round(canvas.height * ratio);

  const out = document.createElement('canvas');
  out.width = outW;
  out.height = outH;
  out.getContext('2d').drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, outW, outH);

  const blob = await new Promise(r => out.toBlob(r, 'image/jpeg', quality));
  const url = URL.createObjectURL(blob);
  return { blob, url };
}

// ===== Thumbnails (max 3) =====
function addThumbFromUrl(url) {
  if (capturedBlobs.length > 3) {
    alert("You cannot capture more than 3 photos.");
    return;
  }
  const wrap = document.createElement('div');
  wrap.className = 'relative w-20 h-20 sm:w-24 sm:h-24 flex-shrink-0';
  const img = document.createElement('img');
  img.src = url;
  img.alt = 'shot';
  img.className = 'w-full h-full object-cover rounded-xl shadow border';
  const rm = document.createElement('button');
  rm.type = 'button';
  rm.className = 'absolute -top-1 -right-1 text-xs bg-red-600 text-white rounded-full px-1 shadow';
  rm.textContent = '✖';
  rm.addEventListener('click', () => {
    wrap.remove();
    capturedBlobs = capturedBlobs.filter(b => b.url !== url);
  });
  wrap.appendChild(img);
  wrap.appendChild(rm);
  thumbs.appendChild(wrap);
}

// ===== Capture button =====
captureBtn.addEventListener('click', async () => {
  const shots = Number(document.getElementById('shotCount').value || 1);
  if (shots > 3) {
    alert("You cannot capture more than 3 shots.");
    return;
  }
  capturedBlobs = [];
  thumbs.innerHTML = "";

  for (let i = 0; i < shots; i++) {
    const { blob, url } = await captureFrame(videoEl);
    capturedBlobs.push({ blob, url });
    addThumbFromUrl(url);
  }
});

// ===== File Picker =====
filePicker.addEventListener('change', async e => {
  const files = Array.from(e.target.files || []);
  for (const f of files) {
    if (!f.type.startsWith("image/")) continue;
    const img = await createImageBitmap(f);
    const canvas = document.createElement("canvas");
    const maxW = 800, maxH = 600;
    let { width, height } = img;
    const ratio = Math.min(maxW / width, maxH / height, 1);
    width = Math.round(width * ratio);
    height = Math.round(height * ratio);
    canvas.width = width;
    canvas.height = height;
    canvas.getContext("2d").drawImage(img, 0, 0, width, height);
    const blob = await new Promise(r => canvas.toBlob(r, "image/jpeg", 0.7));
    const url = URL.createObjectURL(blob);
    capturedBlobs.push({ blob, url });
    addThumbFromUrl(url);
  }
  e.target.value = "";
});

// ===== Switch camera =====
switchCamBtn.addEventListener('click', async () => {
  useBackCamera = !useBackCamera;
  await startCamera();
});
startCamera();

// ===== Checkbox logic =====
function enforceSingleSelect(groupSelector) {
  document.querySelectorAll(groupSelector).forEach(cb => {
    cb.addEventListener('change', e => {
      if (e.target.checked) {
        document.querySelectorAll(groupSelector).forEach(other => {
          if (other !== e.target) other.checked = false;
        });
      }
    });
  });
}
enforceSingleSelect('.status1-checkbox');
enforceSingleSelect('.status2-checkbox');

// ===== Rejection fee toggle =====
document.querySelectorAll('.status1-checkbox').forEach(cb => {
  cb.addEventListener('change', () => {
    const wrap = document.getElementById('rejectionFeeWrap');
    if (cb.checked && cb.value === "Rejected") {
      wrap.classList.remove("hidden");
    } else {
      wrap.classList.add("hidden");
      document.getElementById("rejectionFee").value = "";
    }
  });
});

// ===== Load user history =====
async function loadHistory(showAll = false) {
  const latestBox = document.getElementById("latestHistory");
  const list = document.getElementById("historyList");

  latestBox.innerHTML = "<p class='text-gray-500'>Loading...</p>";
  if (showAll) list.innerHTML = "<p class='text-gray-500'>Loading...</p>";

  const q = query(
    collection(db, "parcels"),
    where("capturerId", "==", user.userId),
    orderBy("timestamp", "desc")
  );

  const snap = await getDocs(q);
  if (snap.empty) {
    latestBox.innerHTML = "<p class='text-gray-500'>No submissions yet.</p>";
    list.innerHTML = "";
    return;
  }

  const first = snap.docs[0].data();
  latestBox.innerHTML = renderHistoryItem(first);

  if (showAll) {
    list.innerHTML = "";
    snap.forEach(doc => {
      const data = doc.data();
      const div = document.createElement("div");
      div.innerHTML = renderHistoryItem(data);
      list.appendChild(div);
    });
  }
}

function renderHistoryItem(data) {
  return `
    <div class="border rounded p-2">
      <p><strong>${data.name}</strong> (${data.phone})</p>
      <p>Address: ${data.address || "-"}</p>
      <p>Sent by: ${data.sender || "-"}</p>
      <p>Status: ${data.status1 || "-"} ${data.status2 || ""}</p>
      ${data.rejectionFee ? `<p>Rejection Fee: GHS ${data.rejectionFee}</p>` : ""}
      <div class="flex gap-2 mt-2 flex-wrap">
        ${(data.photos || []).map(url => `<img src="${url}" class="w-16 h-16 object-cover rounded">`).join("")}
      </div>
      <p class="text-xs text-gray-500 mt-1">
        ${data.timestamp?.toDate ? data.timestamp.toDate().toLocaleString() : ""}
      </p>
    </div>
  `;
}



// ===== Submit handler =====
let isSubmitting = false;
document.getElementById('submitBtn').addEventListener('click', async () => {
  if (isSubmitting) return;
  isSubmitting = true;

  const submitBtn = document.getElementById("submitBtn");
  const prevText = submitBtn.textContent;
  submitBtn.disabled = true;
  submitBtn.textContent = "Saving...";

  try {
    const name = document.getElementById('parcelName').value.trim();
    const address = document.getElementById('parcelAddress').value.trim();
    const phone = document.getElementById('parcelPhone').value.trim();
    const sender = document.getElementById('senderName').value.trim();
    const status1 = document.querySelector('.status1-checkbox:checked')?.value || '';
    const status2 = document.querySelector('.status2-checkbox:checked')?.value || '';

    // validate phone format (Ghana, 10 digits starting with 0)
if (!/^0\d{9}$/.test(phone)) {
  alert("Please enter a valid Ghanaian phone number (10 digits, e.g. 0509967235).");
  submitBtn.disabled = false;
  submitBtn.textContent = prevText;
  isSubmitting = false;
  return;
}


  if (!name || !address || !phone || !sender) {
  alert("Please fill all required fields!");
  submitBtn.disabled = false;
  submitBtn.textContent = prevText;
  isSubmitting = false;
  return;
}

    if (status1 === "Rejected" && capturedBlobs.length > 1) {
      alert("Rejected parcels can only be captured one at a time.");
      return;
    }

    const uploadedUrls = [];
    for (let i = 0; i < capturedBlobs.length; i++) {
      const item = capturedBlobs[i];
      const ts = Date.now();
      const fileName = `parcels/${user.userId}_${ts}_${i}.jpg`;
      const ref = storageRef(storage, fileName);
      await uploadBytes(ref, item.blob);
      const url = await getDownloadURL(ref);
      uploadedUrls.push(url);
    }

    const payload = {
      name, address, phone, sender,
      capturerId: user.userId,
      capturerName: user.name,
      role: user.role,
      status1, status2,
      photoCount: uploadedUrls.length,
      photos: uploadedUrls,
      timestamp: serverTimestamp()
    };

  if (status1 === "Rejected") {
  const feeRaw = document.getElementById("rejectionFee").value;
  if (!feeRaw) {
    alert("Please enter rejection fee");
    submitBtn.disabled = false;
    submitBtn.textContent = prevText;
    isSubmitting = false;
    return;
  }
  payload.rejectionFee = parseFloat(feeRaw);
}


    await addDoc(collection(db, "parcels"), payload);

    submitBtn.textContent = "Saved ✓";
    setTimeout(() => { submitBtn.textContent = prevText; submitBtn.disabled = false; }, 1000);

    document.getElementById('parcelName').value = '';
    document.getElementById('parcelAddress').value = '';
    document.getElementById('parcelPhone').value = '';
    document.getElementById('senderName').value = '';
    document.querySelectorAll('.status1-checkbox, .status2-checkbox').forEach(cb => cb.checked = false);
    document.getElementById('rejectionFeeWrap').classList.add('hidden');
    document.getElementById("rejectionFee").value = "";
    thumbs.innerHTML = '';
    capturedBlobs = [];

    await loadHistory();

} catch (err) {
  console.error("❌ Save failed:", err.code, err.message, err);
  alert("Failed to save. Check console for details.");
  submitBtn.disabled = false;
  submitBtn.textContent = prevText;
} finally {
  isSubmitting = false;
}

});

// ===== Toggle history =====
document.getElementById("toggleHistory").addEventListener("click", () => {
  const list = document.getElementById("historyList");
  const btn = document.getElementById("toggleHistory");
  const showAll = list.classList.contains("hidden");

  if (showAll) {
    list.classList.remove("hidden");
    btn.textContent = "Hide";
    loadHistory(true);
  } else {
    list.classList.add("hidden");
    btn.textContent = "Show All";
  }
});
loadHistory();

const pinModal   = document.getElementById("pinModal");

  });
}
if (cancelPinBtn) cancelPinBtn.addEventListener("click", () => pinModal.classList.add("hidden"));
if (submitPinBtn) {
  submitPinBtn.addEventListener("click", () => {
    if (officerPinInput.value === OFFICER_PIN) {
      window.location.href = "officer.html";
    } else {
      pinError.classList.remove("hidden");
    }
  });
}
if (officerPinInput) {
  officerPinInput.addEventListener("keyup", e => {
    if (e.key === "Enter") submitPinBtn.click();
  });
}
</script>
