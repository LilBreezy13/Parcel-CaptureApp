<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Parcel Capture</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <style>
    :root { --vh: 1vh; }
    html, body { height: 100%; overflow-x: hidden; }
    .vh-screen { min-height: 100svh; min-height: 100dvh; min-height: -webkit-fill-available; min-height: calc(var(--vh) * 100); }
    .kb-scroll { min-height: 0; overflow-y: auto; overscroll-behavior: contain; scroll-padding-bottom: 28vh; }
    input, select, textarea { font-size: 16px; }
    body { background: #f9fafb; color: #111827; }
  </style>
  <script>
    const setVh = () => {
      const vh = window.innerHeight * 0.01;
      document.documentElement.style.setProperty('--vh', `${vh}px`);
    };
    setVh();
    window.addEventListener('resize', setVh);
    window.addEventListener('orientationchange', setVh);
  </script>
  <link rel="icon" href="/favicon (1).ico" type="image/x-icon">
  <link rel="shortcut icon" href="/favicon (1).ico" type="image/x-icon">
</head>

<body class="vh-screen flex flex-col">

  <!-- Navbar -->
  <header class="bg-white shadow-md px-4 py-3 flex justify-between items-center">
    <h1 class="text-base sm:text-lg font-bold">Parcel Capture</h1>
    <div class="flex items-center gap-3">
      <span id="userInfo" class="text-sm font-medium text-gray-700"></span>
      <button id="signOutBtn" class="px-3 py-1.5 bg-red-600 text-white rounded-lg text-xs sm:text-sm hover:bg-red-700">Sign out</button>
    </div>
    
  </header>

  <!-- Main -->
  <main class="kb-scroll flex-1 p-3 sm:p-4 max-w-md mx-auto w-full space-y-5">

    <!-- Camera Section -->
    <section class="bg-white rounded-xl shadow p-3 sm:p-4 space-y-3">
      <h2 class="text-sm sm:text-base font-semibold">Capture Parcel</h2>
      <div class="flex flex-col sm:flex-row gap-2">
        <select id="shotCount" class="w-full border rounded-md p-2 text-base sm:text-sm">
          <option value="1">1 Shot</option>
          <option value="2">2 Shots</option>
          <option value="3">3 Shots</option>
        </select>
        <select id="role" class="w-full border rounded-md p-2 text-base sm:text-sm">
          <option value="Marketer">Marketer</option>
          <option value="Office Assistant">Office Assistant</option>
          <option value="Management">Management</option>
        </select>
      </div>

      <div class="relative w-full">
        <video id="camera" class="w-full rounded-lg bg-black h-48 sm:h-64 object-cover" autoplay playsinline muted></video>
        <canvas id="snapshotCanvas" class="hidden"></canvas>
        <div class="absolute top-2 right-2 flex gap-2">
          <button id="switchCam" type="button" class="px-2 py-1 text-xs sm:text-sm bg-white/80 backdrop-blur rounded-md shadow hover:bg-white">🔄</button>
          <label for="filePicker" class="px-2 py-1 text-xs sm:text-sm bg-white/80 backdrop-blur rounded-md shadow hover:bg-white cursor-pointer">📁</label>
          <input id="filePicker" type="file" accept="image/*" capture="environment" multiple class="hidden" />
        </div>
      </div>

      <div class="flex justify-center">
        <button id="captureBtn" type="button" class="w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-blue-600 text-white flex items-center justify-center shadow-lg hover:bg-blue-700">📸</button>
      </div>
      <div id="thumbs" class="flex gap-2 overflow-x-auto pb-1"></div>
      <p id="cameraHint" class="text-xs text-gray-500">Tip: On mobile, allow camera permission. If camera fails, use 📁 to pick a photo.</p>
    </section>

    <!-- Parcel Details -->
    <section class="bg-blue-50 rounded-xl shadow p-4 sm:p-6 space-y-5">
      <h2 class="text-base sm:text-lg font-semibold text-blue-800">Parcel Details</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Name on Parcel</label>
          <input id="parcelName" type="text" class="w-full rounded-xl border-gray-300 shadow-sm px-3 py-2" placeholder="Enter name">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
          <input id="parcelAddress" type="text" class="w-full rounded-xl border-gray-300 shadow-sm px-3 py-2" placeholder="Enter address">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Contact / Phone</label>
          <input id="parcelPhone" type="tel" class="w-full rounded-xl border-gray-300 shadow-sm px-3 py-2" placeholder="Enter phone number">
        </div>
      </div>
    </section>


    <!-- Parcel Status 01 -->
    <section class="bg-blue-50 rounded-xl shadow p-4 sm:p-6 space-y-4">
      <h2 class="text-base sm:text-lg font-semibold text-blue-800">Parcel Status 01</h2>
      <div id="status1" class="space-y-2">
        <label class="flex items-center gap-3 bg-white px-3 py-2 rounded-lg shadow-sm cursor-pointer">
          <input type="checkbox" name="status1" value="Rejected" class="status1-checkbox w-4 h-4 text-blue-600 rounded"><span class="text-sm">Rejected</span>
        </label>
        <label class="flex items-center gap-3 bg-white px-3 py-2 rounded-lg shadow-sm cursor-pointer">
          <input type="checkbox" name="status1" value="New School" class="status1-checkbox w-4 h-4 text-blue-600 rounded"><span class="text-sm">New School / Late Registration</span>
        </label>
        <label class="flex items-center gap-3 bg-white px-3 py-2 rounded-lg shadow-sm cursor-pointer">
          <input type="checkbox" name="status1" value="Shortages" class="status1-checkbox w-4 h-4 text-blue-600 rounded"><span class="text-sm">Shortages</span>
        </label>

        <!-- Rejection fee (hidden unless Rejected checked) -->
        <div id="rejectionFeeWrap" class="hidden mt-3">
          <label class="block text-sm font-medium text-gray-700 mb-1">Rejection Fee (GHS)</label>
          <input id="rejectionFee" type="number" min="0" step="0.01" class="w-full rounded-xl border-gray-300 px-3 py-2" placeholder="Enter amount in GHS">
        </div>
      </div>
    </section>

    <!-- Parcel Status 02 -->
    <section class="bg-blue-50 rounded-xl shadow p-4 sm:p-6 space-y-4">
      <h2 class="text-base sm:text-lg font-semibold text-blue-800">Parcel Status 02</h2>
      <div id="status2" class="space-y-2">
        <label class="flex items-center gap-3 bg-white px-3 py-2 rounded-lg shadow-sm cursor-pointer">
          <input type="checkbox" name="status2" value="Paid" class="status2-checkbox w-4 h-4 text-green-600 rounded"><span class="text-sm">Paid</span>
        </label>
        <label class="flex items-center gap-3 bg-white px-3 py-2 rounded-lg shadow-sm cursor-pointer">
          <input type="checkbox" name="status2" value="Part Payment" class="status2-checkbox w-4 h-4 text-green-600 rounded"><span class="text-sm">Part Payment</span>
        </label>
        <label class="flex items-center gap-3 bg-white px-3 py-2 rounded-lg shadow-sm cursor-pointer">
          <input type="checkbox" name="status2" value="Not Paid" class="status2-checkbox w-4 h-4 text-green-600 rounded"><span class="text-sm">Not Paid</span>
        </label>
      </div>
    </section>



       <!-- Sender & Capturer (grouped together as requested) -->
    <section class="bg-blue-50 rounded-xl shadow p-4 sm:p-6 space-y-5">
      <h2 class="text-base sm:text-lg font-semibold text-blue-800">Sender & Capturer</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Parcel Sent By</label>
          <input id="senderName" type="text" class="w-full rounded-xl border-gray-300 px-3 py-2" placeholder="Enter sender's name">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Captured By</label>
          <input id="capturerName" type="text" readonly class="w-full rounded-xl border-gray-300 bg-gray-100 px-3 py-2">
        </div>
      </div>
    </section>

    <!-- Submit -->
    <section>
      <div class="flex flex-col sm:flex-row gap-2">
        <button id="submitBtn" class="w-full sm:flex-1 px-6 py-2 bg-green-600 text-white rounded-lg text-sm sm:text-base font-semibold shadow hover:bg-green-700 transition">Submit</button>
      </div>
    </section>

    <!-- History Section -->
    <div class="mt-6">
      <div class="flex justify-between items-center mb-2">
        <h2 class="text-lg font-bold text-gray-800">Submission History</h2>
        <button id="toggleHistory" class="text-sm text-blue-600 underline">Show All</button>
      </div>
      <div id="latestHistory" class="bg-white rounded-lg shadow p-3 mb-2"></div>
      <div id="historyList" class="hidden max-h-64 overflow-y-auto bg-white rounded-lg shadow p-2 space-y-2"></div>
    </div>



<!-- Officer PIN Modal -->
<div id="pinModal" class="fixed inset-0 bg-black/50 flex items-center justify-center hidden z-50">
  <div class="bg-white rounded-xl shadow-lg w-80 p-6 space-y-4">
    <h2 class="text-lg font-semibold text-gray-900">Enter Officer PIN</h2>
    <input id="officerPinInput" type="password" maxlength="6" placeholder="Enter PIN"
      class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-center text-lg">
    <div class="flex justify-end gap-2">
      <button id="cancelPinBtn" class="px-4 py-2 rounded-lg bg-gray-300 text-gray-700 hover:bg-gray-400">Cancel</button>
      <button id="submitPinBtn" class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-700">Submit</button>
    </div>
    <p id="pinError" class="text-red-500 text-sm hidden">Incorrect PIN. Try again.</p>
  </div>
</div>



  </main>

  <footer class="bg-gray-200 text-gray-600 p-3 text-center text-xs sm:text-sm">Parcel Capture • Nicholas Adebayor</footer>

  <!-- Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getFirestore, collection, addDoc, serverTimestamp,
      query, where, onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ===== Firebase config (your project) =====
    const firebaseConfig = {
      apiKey: "AIzaSyB_gTuAS9i-jywpFYLmMEunh2KJmsCW1_o",
      authDomain: "employee-app-c781d.firebaseapp.com",
      projectId: "employee-app-c781d",
      storageBucket: "employee-app-c781d.appspot.com",
      messagingSenderId: "232631444018",
      appId: "1:232631444018:web:37b70fe37975abcc1b922b"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ===== Load logged-in user from sessionStorage (no Firebase Auth) =====
    const user = (() => {
      try { return JSON.parse(sessionStorage.getItem("user")); } catch { return null; }
    })();
    if (!user || !user.userId) {
      // not logged in
      window.location.href = "index.html";
    } else {
      document.getElementById("userInfo").textContent = `${user.name} (${user.userId}) - ${user.role}`;
      document.getElementById("capturerName").value = `${user.name} (${user.userId})`;
      // set the role dropdown to the user's role (keeps your old UI)
      const roleEl = document.getElementById("role");
      if (roleEl) roleEl.value = user.role || roleEl.value;
    }

    // ===== Sign out =====
    document.getElementById("signOutBtn").addEventListener("click", () => {
      sessionStorage.removeItem("user");
      window.location.href = "index.html";
    });

    // ===== Camera & thumbnails (unchanged logic) =====
    const videoEl = document.getElementById('camera');
    const canvasEl = document.getElementById('snapshotCanvas');
    const thumbs = document.getElementById('thumbs');
    const captureBtn = document.getElementById('captureBtn');
    const filePicker = document.getElementById('filePicker');
    const switchCamBtn = document.getElementById('switchCam');

    let currentStream = null;
    let useBackCamera = true;
    let capturedBlobs = [];
    const objectUrls = new Set();

    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        document.getElementById('cameraHint').textContent = 'Camera not available. Use 📁 to select a photo.';
        return;
      }
      if (currentStream) currentStream.getTracks().forEach(t => t.stop());
      try {
        currentStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: useBackCamera ? { exact: 'environment' } : 'user' },
          audio: false
        });
      } catch {
        try {
          currentStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: useBackCamera ? 'environment' : 'user' },
            audio: false
          });
        } catch (err) {
          console.warn('Camera failed, use file picker instead', err);
          document.getElementById('cameraHint').textContent = 'Could not access camera. Use 📁 instead.';
          return;
        }
      }
      videoEl.srcObject = currentStream;
    }

    function addThumbFromUrl(url) {
      const wrap = document.createElement('div');
      wrap.className = 'relative w-14 h-14 sm:w-16 sm:h-16 flex-shrink-0';
      const img = document.createElement('img');
      img.src = url; img.alt = 'shot'; img.className = 'w-full h-full object-cover rounded-lg border';
      const rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'absolute -top-1 -right-1 text-xs bg-black/70 text-white rounded-full px-1';
      rm.textContent = '✖';
      rm.addEventListener('click', () => {
        wrap.remove();
        if (objectUrls.has(img.src)) { URL.revokeObjectURL(img.src); objectUrls.delete(img.src); }
        capturedBlobs = capturedBlobs.filter(b => b.url !== url);
      });
      wrap.appendChild(img); wrap.appendChild(rm); thumbs.appendChild(wrap);
    }

    function resizeAndCompress(fileOrBlob, callback) {
      const img = new Image();
      const url = URL.createObjectURL(fileOrBlob);
      img.onload = () => {
        const maxW = 400, maxH = 300;
        let { width, height } = img;
        const ratio = Math.min(maxW / width, maxH / height, 1);
        width = Math.round(width * ratio); height = Math.round(height * ratio);
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => { callback(blob); URL.revokeObjectURL(url); }, "image/jpeg", 0.4);
      };
      img.src = url;
    }

    captureBtn.addEventListener('click', () => {
      if (!videoEl.videoWidth) return;
      canvasEl.width = videoEl.videoWidth; canvasEl.height = videoEl.videoHeight;
      const ctx = canvasEl.getContext('2d'); ctx.drawImage(videoEl, 0, 0);
      canvasEl.toBlob(blob => {
        if (!blob) return;
        resizeAndCompress(blob, resized => {
          const url = URL.createObjectURL(resized);
          objectUrls.add(url); capturedBlobs.push({ blob: resized, url });
          addThumbFromUrl(url);
        });
      }, "image/jpeg", 0.8);
    });

    filePicker.addEventListener('change', e => {
      const files = Array.from(e.target.files || []);
      for (const f of files) {
        if (!f.type.startsWith("image/")) continue;
        resizeAndCompress(f, resized => {
          const url = URL.createObjectURL(resized);
          objectUrls.add(url); capturedBlobs.push({ blob: resized, url });
          addThumbFromUrl(url);
        });
      }
      e.target.value = "";
    });

    switchCamBtn.addEventListener('click', async () => { useBackCamera = !useBackCamera; await startCamera(); });
    startCamera();

    // Expose simple photo count
    window.__getPhotoCount = () => capturedBlobs.length;

    // ===== Enforce single selection per status group =====
    function enforceSingleSelection(groupClass){
      document.querySelectorAll(`.${groupClass}`).forEach(cb=>{
        cb.addEventListener("change", ()=> {
          if(cb.checked) document.querySelectorAll(`.${groupClass}`).forEach(other=> { if(other!==cb) other.checked=false; });
        });
      });
    }
    enforceSingleSelection("status1-checkbox");
    enforceSingleSelection("status2-checkbox");

    // ===== Rejection fee show/hide logic =====
    const status1Checkboxes = Array.from(document.querySelectorAll('.status1-checkbox'));
    const rejectionFeeWrap = document.getElementById('rejectionFeeWrap');
    function updateRejectionFeeVisibility() {
      const rejectedChecked = status1Checkboxes.some(cb => cb.value === 'Rejected' && cb.checked);
      if (rejectedChecked) rejectionFeeWrap.classList.remove('hidden');
      else { rejectionFeeWrap.classList.add('hidden'); const feeEl = document.getElementById('rejectionFee'); if (feeEl) feeEl.value = ''; }
    }
    status1Checkboxes.forEach(cb => cb.addEventListener('change', updateRejectionFeeVisibility));
    updateRejectionFeeVisibility();

    // ===== Submit Parcel (saves rejectionFee when applicable) =====
    document.getElementById('submitBtn').addEventListener('click', async () => {
      const name = document.getElementById('parcelName').value.trim();
      const address = document.getElementById('parcelAddress').value.trim();
      const phone = document.getElementById('parcelPhone').value.trim();
      const sender = document.getElementById('senderName').value.trim();
      const status1 = document.querySelector('input.status1-checkbox:checked')?.value || '';
      const status2 = document.querySelector('input.status2-checkbox:checked')?.value || '';

      if (!name || !address || !phone || !sender) {
        alert('Please fill all required fields!');
        return;
      }

      // If rejected, require fee
      const isRejected = status1 === 'Rejected';
      let rejectionFee = null;
      if (isRejected) {
        const feeRaw = (document.getElementById('rejectionFee').value || '').trim();
        if (feeRaw === '') { alert('Please enter rejection fee (GHS) for rejected parcel.'); return; }
        rejectionFee = parseFloat(feeRaw);
        if (!isFinite(rejectionFee) || rejectionFee < 0) { alert('Enter a valid rejection fee amount.'); return; }
      }

      const submitBtn = document.getElementById('submitBtn');
      const prevText = submitBtn.textContent;
      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving...';

      try {
        const payload = {
          name, address, phone,
          sender,
          capturerId: user.userId,
          capturerName: user.name,
          role: user.role,
          status1, status2,
          photoCount: capturedBlobs.length,
          timestamp: serverTimestamp()
        };
        if (isRejected && rejectionFee !== null) payload.rejectionFee = rejectionFee;

        await addDoc(collection(db, "parcels"), payload);

        submitBtn.textContent = 'Saved ✓';
        setTimeout(()=>{ submitBtn.textContent = prevText; submitBtn.disabled = false; }, 900);

        // Clear form + previews
        document.getElementById('parcelName').value = '';
        document.getElementById('parcelAddress').value = '';
        document.getElementById('parcelPhone').value = '';
        document.getElementById('senderName').value = '';
        document.querySelectorAll('.status1-checkbox, .status2-checkbox').forEach(cb => cb.checked = false);
        updateRejectionFeeVisibility();
        objectUrls.forEach(u => URL.revokeObjectURL(u));
        objectUrls.clear();
        thumbs.innerHTML = '';
        capturedBlobs = [];
      } catch (err) {
        console.error("Error saving to Firestore:", err);
        alert('Save failed: ' + (err?.message || 'unknown error'));
        submitBtn.disabled = false;
        submitBtn.textContent = prevText;
      }
    });

    // ===== History: only show entries for this user (capturerId === user.userId) =====
    const latestHistory = document.getElementById("latestHistory");
    const historyList = document.getElementById("historyList");
    const toggleHistory = document.getElementById("toggleHistory");

    function renderHistoryItem(data) {
      const time = data.timestamp?.toDate?.().toLocaleString() || "";
      const photoCount = data.photoCount || 0;
      const s1 = data.status1 || "—";
      const s2 = data.status2 || "—";
      const feeHtml = (data.rejectionFee !== undefined && data.rejectionFee !== null && isFinite(data.rejectionFee))
        ? `<p class="text-xs text-red-600">Rejection Fee: GHS ${Number(data.rejectionFee).toFixed(2)}</p>`
        : "";
      const div = document.createElement("div");
      div.className = "p-3 border-b border-gray-200";
      div.innerHTML = `
        <div class="flex justify-between items-center">
          <h3 class="font-semibold text-gray-900">${escapeHtml(data.name)}</h3>
          <span class="text-xs text-gray-500">${time}</span>
        </div>
        <p class="text-sm text-gray-600">${escapeHtml(data.address)}</p>
        <p class="text-xs text-gray-500">📞 ${escapeHtml(data.phone || '')}</p>
        <p class="text-xs text-gray-500">Sent by: ${escapeHtml(data.sender || '—')} | Captured by: ${escapeHtml(data.capturerName || '')} (${escapeHtml(data.role || '')})</p>
        <p class="text-xs text-gray-500">📷 ${photoCount} photos</p>
        <p class="text-xs text-gray-500">Status 1: ${escapeHtml(s1)} | Status 2: ${escapeHtml(s2)}</p>
        ${feeHtml}
      `;
      return div;
    }

    // small helper to avoid injecting raw HTML from data
    function escapeHtml(str) {
      if (!str && str !== 0) return '';
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    // Query only parcels created by this logged-in user
    const parcelsQuery = query(collection(db, "parcels"), where("capturerId", "==", user.userId));
    onSnapshot(parcelsQuery, (snapshot) => {
      // convert docs to array with data, then sort descending by timestamp (client-side)
      const docs = snapshot.docs.map(d => ({ id: d.id, data: d.data() }));
      docs.sort((a,b) => {
        const at = a.data.timestamp?.toMillis ? a.data.timestamp.toMillis() : 0;
        const bt = b.data.timestamp?.toMillis ? b.data.timestamp.toMillis() : 0;
        return bt - at;
      });

      latestHistory.innerHTML = "";
      historyList.innerHTML = "";
      let first = true;
      for (const item of docs) {
        const node = renderHistoryItem(item.data);
        if (first) { latestHistory.appendChild(node); first = false; }
        else historyList.appendChild(node);
      }
    });

    // Toggle show/hide history list (keeps same UI)
    let showAll = false;
    toggleHistory.addEventListener("click", () => {
      showAll = !showAll;
      if (showAll) {
        historyList.classList.remove("hidden");
        toggleHistory.textContent = "Hide";
      } else {
        historyList.classList.add("hidden");
        toggleHistory.textContent = "Show All";
      }
    });


    // ===== Officer PIN logic =====
const officerBtn = document.createElement("button");
officerBtn.textContent = "Officer Dashboard";
officerBtn.className = "px-3 py-1.5 bg-blue-600 text-white rounded-lg text-xs sm:text-sm hover:bg-blue-700";
document.querySelector("header .flex.items-center").prepend(officerBtn);

const pinModal = document.getElementById("pinModal");
const officerPinInput = document.getElementById("officerPinInput");
const submitPinBtn = document.getElementById("submitPinBtn");
const cancelPinBtn = document.getElementById("cancelPinBtn");
const pinError = document.getElementById("pinError");

const correctPin = "1234"; // 🔐 Change this to your secret PIN

officerBtn.addEventListener("click", (e) => {
  e.preventDefault();
  officerPinInput.value = "";
  pinError.classList.add("hidden");
  pinModal.classList.remove("hidden");
  officerPinInput.focus();
});

cancelPinBtn.addEventListener("click", () => {
  pinModal.classList.add("hidden");
});

submitPinBtn.addEventListener("click", () => {
  if (officerPinInput.value.trim() === correctPin) {
    pinModal.classList.add("hidden");
    window.location.href = "officer.html";
  } else {
    pinError.classList.remove("hidden");
    officerPinInput.value = "";
    officerPinInput.focus();
  }
});

// Allow Enter key
officerPinInput.addEventListener("keypress", (e) => {
  if (e.key === "Enter") submitPinBtn.click();
});


  </script>
</body>
</html>
